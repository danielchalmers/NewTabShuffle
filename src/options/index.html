<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab Shuffle</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>New Tab Shuffle</h1>
      <ul class="guide" id="urls-guide">
        <li>One URL per line. Supports http://, https://, and file://.</li>
        <li>Delete a line to remove it. Prefix with # to disable.</li>
      </ul>
    </header>

    <main>
      <section class="editor-section">
        <label class="editor-label" for="urls-textarea">Your URLs</label>
        <textarea
          id="urls-textarea"
          spellcheck="false"
          aria-describedby="urls-guide"
          aria-errormessage="error-message"
          aria-invalid="false"
          placeholder="https://example.com&#10;# https://paused.example.com&#10;file:///C:/path/to/file.html"
        ></textarea>
        <div class="status-row">
          <span id="save-status" class="status" data-state="saved" role="status" aria-live="polite" aria-atomic="true">Saved</span>
          <span id="count-status" class="counts">No URLs yet</span>
        </div>
        <p id="error-message" class="error hidden" role="alert" aria-atomic="true"></p>
      </section>

      <section class="editor-section">
        <label class="editor-label" for="queue-textarea">Current queue</label>
        <textarea
          id="queue-textarea"
          spellcheck="false"
          aria-errormessage="queue-error-message"
          aria-invalid="false"
          placeholder="https://example.com&#10;https://another.example.com"
        ></textarea>
        <div class="status-row">
          <span id="queue-save-status" class="status" data-state="saved" role="status" aria-live="polite" aria-atomic="true">Saved</span>
          <div class="queue-actions">
            <span id="queue-count-status" class="counts">Queue empty</span>
            <button id="queue-reset" class="secondary-button" type="button">Clear queue</button>
          </div>
        </div>
        <p id="queue-error-message" class="error hidden" role="alert" aria-atomic="true"></p>
      </section>
    </main>
  </div>

  <script type="module" src="options.ts"></script>
</body>
</html>
