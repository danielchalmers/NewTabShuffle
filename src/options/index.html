<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab Shuffle Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>New Tab Shuffle Options</h1>
      <p class="subtitle">Paste URLs below, one per line. Changes save automatically.</p>
      <ul class="guide">
        <li>Delete a line to remove it.</li>
        <li>Start a line with # to disable it.</li>
        <li>Supports http://, https://, and file://.</li>
      </ul>
    </header>

    <main>
      <section class="editor-section">
        <label class="editor-label" for="urls-textarea">Your URLs</label>
        <textarea
          id="urls-textarea"
          spellcheck="false"
          placeholder="https://example.com&#10;# https://paused.example.com&#10;file:///C:/path/to/file.html"
        ></textarea>
        <div class="status-row">
          <span id="save-status" class="status" data-state="saved">Saved</span>
          <span id="count-status" class="counts">No URLs yet</span>
        </div>
        <p id="error-message" class="error hidden"></p>
      </section>
    </main>
  </div>

  <script type="module" src="options.ts"></script>
</body>
</html>
